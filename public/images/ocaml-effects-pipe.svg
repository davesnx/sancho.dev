<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Execution trace of a pipe implemented with an effect handler</title>
  <desc id="desc">The left users expression emits a user object and pauses. The pipe handler runs the right name expression, which emits Alice with a new continuation to the outer collector. The collector resumes the right side, which returns to the pipe. The pipe then resumes the left continuation and repeats for Bob.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#B9BDC3"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#17E620"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { fill: #DCDCDC; font-size: 18px; font-weight: 700; letter-spacing: .08em; }
      .lane { fill: #DCDCDC; font-size: 16px; font-weight: 650; }
      .code { fill: #DCDCDC; font-size: 15px; }
      .body { fill: #999FA8; font-size: 14px; }
      .note { fill: #848686; font-size: 13px; }
    </style>
  </defs>

  <rect width="960" height="760" rx="18" fill="#171717"/>
  <text x="48" y="52" class="sans heading">A PIPE IS A HANDLER BETWEEN TWO EXPRESSIONS</text>
  <rect x="48" y="76" width="864" height="54" rx="9" fill="#272727" stroke="#4C4D4D"/>
  <text x="72" y="109" class="mono code">.users[]</text>
  <text x="234" y="109" class="mono code" fill="#17E620">|</text>
  <text x="266" y="109" class="mono code">.name</text>
  <text x="700" y="109" class="mono note">no intermediate list</text>

  <text x="66" y="174" class="sans lane">left: .users[]</text>
  <text x="302" y="174" class="sans lane">pipe handler</text>
  <text x="532" y="174" class="sans lane">right: .name</text>
  <text x="760" y="174" class="sans lane">collector</text>

  <line x1="126" y1="196" x2="126" y2="708" stroke="#4C4D4D" stroke-dasharray="4 6"/>
  <line x1="366" y1="196" x2="366" y2="708" stroke="#4C4D4D" stroke-dasharray="4 6"/>
  <line x1="594" y1="196" x2="594" y2="708" stroke="#4C4D4D" stroke-dasharray="4 6"/>
  <line x1="820" y1="196" x2="820" y2="708" stroke="#4C4D4D" stroke-dasharray="4 6"/>

  <rect x="68" y="218" width="116" height="42" rx="7" fill="#272727" stroke="#4C4D4D"/>
  <text x="82" y="244" class="mono code">emit user1</text>
  <path d="M184 239H352" fill="none" stroke="#B9BDC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="226" class="mono note">user1 + k1</text>

  <rect x="308" y="276" width="116" height="42" rx="7" fill="#141414" stroke="#17E620"/>
  <text x="322" y="302" class="sans body">pause left</text>
  <path d="M424 297H580" fill="none" stroke="#17E620" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="466" y="284" class="sans note">run with user1</text>

  <rect x="536" y="334" width="116" height="42" rx="7" fill="#272727" stroke="#4C4D4D"/>
  <text x="550" y="360" class="mono code">emit "Alice"</text>
  <path d="M652 355H806" fill="none" stroke="#B9BDC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="342" class="mono note">"Alice" + kr1</text>

  <rect x="764" y="392" width="112" height="42" rx="7" fill="#272727" stroke="#4C4D4D"/>
  <text x="778" y="418" class="mono code">["Alice"]</text>

  <path d="M820 434V458H608V474" fill="none" stroke="#17E620" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="674" y="449" class="mono note">continue kr1 ()</text>

  <rect x="536" y="480" width="116" height="42" rx="7" fill="#272727" stroke="#4C4D4D"/>
  <text x="550" y="506" class="mono code">return ()</text>
  <path d="M536 501H380V532" fill="none" stroke="#B9BDC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="488" class="sans note">right side finishes</text>

  <rect x="294" y="538" width="144" height="42" rx="7" fill="#141414" stroke="#17E620"/>
  <text x="307" y="564" class="mono code">continue k1 ()</text>
  <path d="M352 580H140V606" fill="none" stroke="#17E620" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="68" y="612" width="116" height="42" rx="7" fill="#272727" stroke="#4C4D4D"/>
  <text x="82" y="638" class="mono code">emit user2</text>
  <path d="M184 633H352" fill="none" stroke="#B9BDC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="620" class="mono note">user2 + k2</text>

  <rect x="306" y="670" width="120" height="42" rx="7" fill="#141414" stroke="#17E620"/>
  <text x="321" y="696" class="sans body">repeat...</text>

  <text x="48" y="738" class="sans note">k1 stores the array position; kr1 stores the rest of the right expression.</text>
</svg>
